services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: power-demand-backend

    ports:
      - "8000:8000"

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000

    container_name: power-demand-frontend

    ports:
      - "3000:3000"

    depends_on:
      - backend

    restart: unless-stopped